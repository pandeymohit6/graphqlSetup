version: '3.4'

services:
  postgres:
    container_name: thread_db
    image: postgres
    port:
     - 5432:5432
    volumes:
     - postgres_data:/var/lib/postgresql/postgres_data
    environment:
      POSTGRES_USER:postgres
      POSTGRES_DB:thread
      POSTGRES_PASSWORD:postgres
      

volumes:
  postgres_data